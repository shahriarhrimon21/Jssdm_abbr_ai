<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JSSDM ABBR StaffAI">
  <!--
    Glyph — favicon, browser tab, PWA / home-screen icon (16-32px).
    The most aggressive reduction of the approved crest: field, ring and
    the tri-service division only, with the wedges opened up and the ring
    thickened so the three-part silhouette survives at 16px. Drawn on a
    rounded square rather than a circle so it holds its shape when a
    platform masks it, with all artwork inside the maskable safe area.
  -->
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4D98F"/>
      <stop offset=".5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#9A7620"/>
    </linearGradient>
    <linearGradient id="gField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16563E"/>
      <stop offset="1" stop-color="#052018"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#gField)"/>
  <rect x="3.4" y="3.4" width="57.2" height="57.2" rx="10.4"
        fill="none" stroke="url(#gGold)" stroke-width="2.8"/>

  <!-- gold ground, three maroon wedges, wide gold gaps -->
  <circle cx="32" cy="32" r="21" fill="url(#gGold)"/>
  <g fill="#78121F">
    <path d="M32 32 47.6 21.9A18.6 18.6 0 0 0 16.4 21.9Z"/>
    <path d="M32 32 15.3 23.6A18.6 18.6 0 0 0 30.8 50.6Z"/>
    <path d="M32 32 33.2 50.6A18.6 18.6 0 0 0 48.7 23.6Z"/>
  </g>
</svg>
