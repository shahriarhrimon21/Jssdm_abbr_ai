[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# NOTE: an earlier explicit passthrough redirect for "/.netlify/functions/*"
# was removed here — current Netlify CLI rejects any redirect "from" path
# under the reserved "/.netlify/" namespace ("path field must not start
# with /.netlify"), which surfaced as a harmless-but-noisy parse warning on
# every `netlify dev`/deploy. It was always redundant anyway (see the SPA
# fallback below's comment): Netlify resolves /.netlify/functions/* before
# user redirects regardless, with or without this rule.

# Client-side router fallback (the app is a single page; all internal
# navigation is in-memory state, not real routes, but this keeps a direct
# reload/deep-link from ever 404ing).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"
  functions = "netlify/functions"
  autoLaunch = false
